name: iOS · unsigned IPA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Test core and build unsigned device IPA
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Core unit tests
        run: |
          set -o pipefail
          mkdir -p build
          swift test 2>&1 | tee build/core-tests.log
      - name: Generate native project and artwork
        run: python3 Scripts/make_project.py
      - name: Build iphoneos arm64 without signing
        run: |
          set -o pipefail
          xcodebuild -project MyResearch.xcodeproj -scheme MyResearch \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build 2>&1 | tee build/device-build.log
      - name: Package and validate IPAs
        run: python3 Scripts/package_ipa.py
      - name: Upload unsigned IPAs
        uses: actions/upload-artifact@v4
        with:
          name: MyResearch-unsigned-IPA
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-build-logs
          path: build/*.log
          retention-days: 14
  ui:
    name: Simulator interaction tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and generate project
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          python3 Scripts/make_project.py
      - name: Boot iPhone simulator
        run: |
          mkdir -p build
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl list devices available --json > build/devices.json
          DEVICE=$(python3 - <<'PY'
          import json
          data=json.load(open('build/devices.json'))['devices']
          candidates=[d for runtime,devices in data.items() if 'iOS-18-5' in runtime for d in devices if 'iPhone' in d['name'] and d.get('isAvailable')]
          if not candidates: raise SystemExit('No iOS 18.5 iPhone simulator is available.')
          selected=next((d for d in candidates if d['name']=='iPhone 16 Pro'),candidates[0])
          print(selected['udid'])
          PY
          )
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
      - name: Build and launch simulator app independently
        timeout-minutes: 6
        run: |
          set -o pipefail
          xcodebuild build -project MyResearch.xcodeproj -scheme MyResearch \
            -configuration Debug -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/Simulator CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build/simulator-build.log
          xcrun simctl install "$SIMULATOR_ID" build/Simulator/Build/Products/Debug-iphonesimulator/MyResearch.app
          xcrun simctl launch --terminate-running-process "$SIMULATOR_ID" com.dandibbert.MyResearch \
            --ui-testing '--query=春莱布' -AppleLanguages '(zh-Hans)' -AppleLocale zh_CN
          mkdir -p build/launch-preview
          sleep 5
          xcrun simctl io "$SIMULATOR_ID" screenshot build/launch-preview/search-light.png
          xcrun simctl ui "$SIMULATOR_ID" appearance dark
          sleep 2
          xcrun simctl io "$SIMULATOR_ID" screenshot build/launch-preview/search-dark.png
          xcrun simctl ui "$SIMULATOR_ID" appearance light
          xcrun simctl terminate "$SIMULATOR_ID" com.dandibbert.MyResearch
      - name: Upload independent launch screenshots
        uses: actions/upload-artifact@v4
        with:
          name: simulator-launch-preview
          path: build/launch-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Run native UI tests
        timeout-minutes: 8
        run: |
          set -o pipefail
          xcodebuild test -project MyResearch.xcodeproj -scheme MyResearch \
            -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/Simulator -resultBundlePath build/UI.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 60 CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build/ui-tests.log
      - name: Export screenshots
        if: always()
        run: |
          if [ -d build/UI.xcresult ]; then
            xcrun xcresulttool export attachments --path build/UI.xcresult --output-path build/screenshots || true
            xcrun xcresulttool get test-results summary --path build/UI.xcresult > build/ui-summary.json || true
          fi
      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-tests-and-screenshots
          path: |
            build/ui-tests.log
            build/simulator-build.log
            build/ui-summary.json
            build/launch-preview
            build/UI.xcresult
            build/screenshots
          if-no-files-found: warn
          retention-days: 14
